version: '3.8'

services:
  # SERVIÇO 1: Catálogo de Filmes (Único Ponto de Entrada Público)
  web:
    build: .
    ports:
      - "${PORT_HOST:-${PORT:-8204}}:3000"
    environment:
      - PORT=3000
      - INTERNAL_PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - LOG_SERVICE_URL=http://log-service:3002
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=perfil-fotos
      - SESSION_SECRET=${SESSION_SECRET}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT:-3306}
      - APP_URL=${APP_URL:-http://localhost:8204}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
    depends_on:
      - auth-service
      - log-service
      - minio
    networks:
      - app-network
    restart: always

  # SERVIÇO 2: Microsserviço de Autenticação (Acessível APENAS internamente)
  auth-service:
    build: ./auth-service
    environment:
      - PORT=3001
      - INTERNAL_PORT=3001
      - LOG_SERVICE_URL=http://log-service:3002
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT:-3306}
      - SMTP_HOST=${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-"Catálogo Tom Hanks <no-reply@catalogofilmes.com>"}
      - APP_URL=${APP_URL:-http://localhost:8204}
    depends_on:
      - log-service
    networks:
      - app-network
    restart: always

  # SERVIÇO 3: Microsserviço de Logs e Auditoria (Acessível APENAS internamente)
  log-service:
    build: ./log-service
    environment:
      - PORT=3002
      - INTERNAL_PORT=3002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_STREAM_KEY=audit_stream
    depends_on:
      - redis
    networks:
      - app-network
    restart: always

  # SERVIÇO 4: Banco em Memória Redis (Streams para Logs de Auditoria)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - app-network
    restart: always

  # SERVIÇO 5: MinIO Object Storage (Armazenamento de Fotos de Perfil)
  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.82.4.0/24