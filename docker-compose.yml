version: '3.8'

services:
  # SERVIÇO 1: Catálogo de Filmes (Único Ponto de Entrada Público)
  web:
    build: .
    ports:
      - "${PORT_HOST:-${PORT:-8204}}:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - SESSION_SECRET=${SESSION_SECRET}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT:-3306}
    depends_on:
      - auth-service
    networks:
      - app-network
    restart: always

  # SERVIÇO 2: Microsserviço de Autenticação (Acessível APENAS internamente)
  auth-service:
    build: ./auth-service
    # ATENÇÃO: Nenhuma porta mapeada pro host (sem ports:), visível apenas na rede Docker interna
    environment:
      - PORT=3001
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT:-3306}
      - SMTP_HOST=${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-"Catálogo Tom Hanks <no-reply@catalogofilmes.com>"}
      - APP_URL=${APP_URL:-http://localhost:8204}
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.82.4.0/24